name: Release

# Push a tag like v1.0.0 (matching the version in pubspec.yaml) to publish:
# a signed Android bundle to Play's internal track (once the
# PLAY_SERVICE_ACCOUNT_JSON secret exists), and a GitHub release with the
# signed APK plus experimental, unsigned desktop builds.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.2'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag matches pubspec version
        run: |
          PUBSPEC=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          [ "v$PUBSPEC" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME != pubspec $PUBSPEC"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          FLAGS=$(./scripts/build_flags.sh)
          flutter build appbundle --release $FLAGS
          flutter build apk --release $FLAGS
          cp build/app/outputs/flutter-apk/app-release.apk "timeflow-$GITHUB_REF_NAME.apk"

      - name: Upload to Play internal track
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        if: env.PLAY_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.rinserepeatlabs.timeflow
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: timeflow-*.apk

  desktop:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            path: build/linux/x64/release/bundle
          - os: windows-latest
            platform: windows
            path: build/windows/x64/runner/Release
          - os: macos-latest
            platform: macos
            path: build/macos/Build/Products/Release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Build
        shell: bash
        run: flutter build ${{ matrix.platform }} --release $(./scripts/build_flags.sh)

      - uses: actions/upload-artifact@v4
        with:
          name: timeflow-${{ matrix.platform }}
          path: ${{ matrix.path }}

  publish:
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4

      - name: Zip desktop builds
        run: |
          for p in linux windows macos; do
            (cd "timeflow-$p" && zip -qr "../timeflow-$GITHUB_REF_NAME-$p-experimental.zip" .)
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            android/timeflow-*.apk
            timeflow-*-experimental.zip
          generate_release_notes: true
