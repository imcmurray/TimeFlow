name: timeflow
description: Experience time as a gentle flowing river, not a pressure cooker. A revolutionary daily schedule app that transforms how you experience time.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.4.0

  # Local Database (SQLite)
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  path_provider: ^2.1.1
  path: ^1.8.3

  # Local Notifications
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1

  # UI Enhancements
  cupertino_icons: ^2.0.0

  # Utilities
  uuid: ^4.2.2
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  package_info_plus: ^10.2.2
  url_launcher: ^6.2.0

  # Image/File handling
  image_picker: ^1.0.7
  share_plus: ^13.3.1
  file_picker: ^13.1.0

  # Window management
  window_to_front: ^1.0.0

  # Audio playback
  audioplayers: ^6.5.1

  # Web platform interop (used by file_export_web.dart)
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  drift_dev: ^2.35.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/sounds/

  # fonts:
  #   - family: Nunito
  #     fonts:
  #       - asset: assets/fonts/Nunito-Regular.ttf
  #       - asset: assets/fonts/Nunito-Bold.ttf
  #         weight: 700
